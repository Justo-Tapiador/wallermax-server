# wallermax-server configuration file.
#
# Values here override the built-in defaults. In turn, environment variables
# prefixed with `WALLERMAX_` override the values in this file
# (e.g. WALLERMAX_SERVER__PORT=9000). Optional personal overrides can be
# placed in `wallermax.local.toml` (git-ignored) which wins over this file.
#
# Conventions:
#   [middleware]        -> boolean switches for the middleware pipeline
#   other sections      -> tuning values for each middleware

[server]
# Address the server binds to. Use "0.0.0.0" to accept connections
# from other machines (e.g. containers or LAN testing).
host = "127.0.0.1"

# Port the server binds to. Use 0 to let the OS pick a free port.
port = 8080

# Reverse proxies whose X-Forwarded-For header is trusted. Entries are
# exact IPs ("10.0.0.4") or CIDR blocks ("10.0.0.0/8", "fd00::/8").
# While empty, the client IP used by rate limiting and audit logs is the
# TCP peer address and spoofed X-Forwarded-For values are ignored — the
# safe default. Only list your actual proxy here.
trusted_proxies = []

# Maximum time, in seconds, a single request may take before the server
# answers with a 408 Request Timeout.
request_timeout_secs = 15

# Maximum time, in seconds, to wait for in-flight requests to complete
# during graceful shutdown before forcing the server to stop.
shutdown_timeout_secs = 15

# Maximum accepted request body size, in bytes (1 MiB). Oversized bodies
# are rejected with 413 Payload Too Large while [middleware] body_limit
# is enabled.
max_body_size_bytes = 1048576

[logging]
# Minimum log level: trace | debug | info | warn | error.
# The RUST_LOG environment variable takes precedence when set.
level = "info"

# Log output format: pretty | json | compact.
format = "pretty"

[middleware]
# Each middleware in the pipeline can be enabled or disabled independently.
request_id = true        # unique X-Request-Id correlation ids
logging = true           # structured request logging + X-Response-Time
security_headers = true  # security response headers on every response
timeout = true           # per-request timeout (server.request_timeout_secs)
rate_limit = true        # per-client-IP rate limiting ([rate_limit])
cors = false             # cross-origin resource sharing ([cors])
body_limit = true        # request body size limit (server.max_body_size_bytes)

[request_id]
# How client-supplied X-Request-Id values are treated:
#   accept    -> reuse a valid client-supplied id (default)
#   overwrite -> always generate a server-side id, ignoring the client
mode = "accept"

[rate_limit]
# Token bucket per client IP.
# capacity          -> burst size: requests allowed before throttling
# refill_per_second -> steady rate at which the bucket recovers
capacity = 60
refill_per_second = 10.0

[cors]
# Allowed browser origins, e.g. ["https://app.example.com"], or ["*"] for
# any origin (cannot be combined with specific origins). An empty list
# rejects all cross-origin browser requests (the safe default).
# Takes effect while [middleware] cors = true.
allowed_origins = []

# How long, in seconds, browsers may cache preflight responses.
max_age_secs = 3600

[security_headers]
# Security response headers applied to every response.
# An empty value ("") omits that header from responses.
x_content_type_options = "nosniff"
x_frame_options = "DENY"
referrer_policy = "no-referrer"
# v0.8.0 default: styles and same-origin images are allowed (the CMS UI
# stylesheet lives at public/assets/wallermax.css) and forms may only post
# back to this origin. SCRIPTS REMAIN BLOCKED: the whole site — CMS
# included — works without a single line of JavaScript.
content_security_policy = "default-src 'none'; style-src 'self'; img-src 'self' data:; form-action 'self'; frame-ancestors 'none'; base-uri 'none'"
strict_transport_security = "max-age=31536000; includeSubDomains"

[external_api]
# Server-side proxy for external APIs (v0.12.0). Browsers call named
# endpoints on this server (GET/POST /api/ext/<name>) and it forwards
# the request upstream with the configured headers attached — API keys
# never reach the browser, and the upstream's CORS policy stops
# mattering (server-to-server calls are not bound by it).
#
# The family mounts only while at least one endpoint is configured;
# with no endpoints (the default below) /api/ext/... answers the JSON 404.
# Per-call upstream timeout in seconds. Keep it below
# server.request_timeout_secs so the proxy answers the browser with its
# own 502 before the global request timeout truncates the call.
timeout_secs = 8

# Maximum forwarded upstream body in bytes. An upstream answering with
# more than this becomes a 502 (reading stops at the cap, so memory
# stays bounded).
response_limit_bytes = 262144

# Named upstreams — one entry is one route. `name` follows the CMS slug
# rules (lowercase, digits, single dashes) and becomes the path segment;
# the incoming query string is appended to `url` on every call.
# `auth_required = true` demands a valid Bearer token or session cookie.
# Header values may reference the environment with ${VAR}, expanded once
# at startup — a missing variable is a startup error, and the committed
# file can hold placeholders while real keys live in
# wallermax.local.toml (git-ignored) or the process environment.
#
# [[external_api.endpoints]]
# name = "weather"
# url = "https://api.weather.example.com/v1/current"
# auth_required = false
#
# [external_api.endpoints.headers]
# X-Api-Key = "${WEATHER_API_KEY}"
#
# Fixed query parameters (the keyParam pattern) go under
# [external_api.endpoints.query] — for upstreams that want the key in
# the URL instead of a header (OMDb's `apikey`, Google's `key`, ...).
# Values expand ${VAR} at startup exactly like header values, and a
# name configured here always replaces the same name arriving from the
# browser, so the page can neither read nor shadow the injected secret:
#
# [[external_api.endpoints]]
# name = "omdb"
# url = "https://www.omdbapi.com/"
# auth_required = false
#
# [external_api.endpoints.query]
# apikey = "${OMDB_API_KEY}"
#
# Everything after the endpoint name is a subpath joined onto `url`
# with exactly one `/` — one entry covers a whole /api/v1/<resource>
# style API (`.`/`..` segments answer 400; the tail is re-encoded
# canonically, so it can only steer the path, never the host):
#
# GET /api/ext/xmdb/movies?q=Alien
#   → https://xmdbapi.com/api/v1/movies?q=Alien&apiKey=...
#
# [[external_api.endpoints]]
# name = "xmdb"
# url = "https://xmdbapi.com/api/v1/"
# auth_required = false
#
# [external_api.endpoints.query]
# apiKey = "${XMDB_API_KEY}"

[static]
# Static file serving for otherwise unmatched paths.
# While enabled: GET / answers with public/index.html, other paths resolve
# against files inside public/ (e.g. /style.css -> public/style.css),
# missing files answer the standard JSON 404 envelope, and the JSON
# service index moves to GET /api.
#
# NOTE (v0.8.0): the stock public/index.html was REMOVED so the site
# home falls through to views/index.jhs — the dynamic CMS home that
# lists the published pages and carries the login/logout header.
# Drop your own index.html back in to pin a static home instead.
enabled = true

# Directory holding the static assets, relative to the working directory
# (absolute paths are allowed too). It must exist at startup when
# static serving is enabled. `..` segments are rejected at validation.
root_dir = "public"

# File served for GET / (looked up inside root_dir). Directory requests
# such as /docs/ always resolve to docs/index.html inside that directory.
index_file = "index.html"

# NOTE: the default [security_headers] content_security_policy is
# `default-src 'none'`, which blocks scripts, styles and images on these
# pages. The shipped public/index.html is plain HTML on purpose. If you
# serve a real site, relax content_security_policy to allow the assets
# you actually use, e.g. "default-src 'self'".

[templates]
# Dynamic .jhs template rendering (PHP-style JavaScript templates,
# ported faithfully from the node-jhs2 engine and sandboxed with
# boa_engine). While enabled: GET /hello.jhs renders public/hello.jhs
# on the fly (the source is never served raw), otherwise-unmatched
# paths auto-route to views/ (GET /contacto -> views/contacto.jhs,
# GET /blog -> views/blog.jhs or views/blog/index.jhs), API routes
# keep precedence and unresolved paths answer the JSON 404 envelope.
# Template errors answer the standard JSON error envelope (500).
#
# v0.9.0 adds the original engine's require() as a native bridge:
# require('crypto') returns a Rust polyfill (randomBytes, randomUUID),
# and any pure-JS CommonJS module under modules/ can be imported
# (`module.exports`, `exports`, `require`, `__filename`, `__dirname`).
# There is no Node.js behind the sandbox, so native addons and
# built-ins without a polyfill fail with descriptive errors — the
# forbidden_modules banner below decides what is rejected outright.
enabled = true

# Rendering backend (v0.10.0):
#   "auto"    — (default) render on the Node sidecar when Node.js is
#                available (the ORIGINAL node-jhs2 engine: real
#                require() behind the banner, worker hard-kill), with a
#                transparent fallback to the in-process sandbox the
#                moment the sidecar is unavailable (and automatic
#                recovery via health probes).
#   "boa"     — always the in-process sandboxed engine. No Node.js
#                needed anywhere; the hardened v0.5-v0.9 behaviour.
#   "sidecar" — strict: the server refuses to start unless the Node
#                sidecar launches and passes its 13-check selftest
#                (escaping, raw(), console capture, res.redirect,
#                require() banner, hard-kill, hot reload...).
# The backend covers EVERY template render in the process — .jhs files
# under public/, auto-routed views/ pages and CMS page bodies alike.
backend = "auto"

# Directory holding the view templates, relative to the working
# directory (absolute paths are allowed too). It must exist at startup
# while rendering is enabled. `..` segments are rejected at validation.
views_dir = "views"

# Cache compiled templates, recompiling automatically when a file's
# modification time changes (no restart needed).
cache = true

# HTML-escape all dynamic output (<?= ?> expressions and echo() calls).
# Literal template text is never escaped; raw() always bypasses it.
auto_escape = true

# Expose the authenticated identity to templates as the `user` global:
# user = { id, username, role } with a valid Authorization: Bearer token
# or wallermax_session cookie (verified: signature, expiry, issuer),
# user = null for anonymous visitors, disabled [auth], or credentials
# that fail verification. Templates then branch on it:
# <?jhs if (user && user.role == 'admin') { ?> ...
# Turn off when pages must stay identity-free (e.g. CDN caching).
expose_user = true

# Upper bound on loop iterations inside one render. Protects the
# workers from runaway template loops (the sandbox throws when a
# template exceeds it). Must be greater than zero.
loop_iteration_limit = 10000000

# Master switch for require() (v0.9.0). While false, `require` is
# undefined and templates behave exactly like the v0.8.x sandbox.
require_enabled = true

# Directory local JavaScript modules resolve under, relative to the
# working directory (absolute paths are allowed too). Drop pure-JS
# CommonJS modules here (yours, or npm packages copied in) and import
# them from templates: <?jhs const { hello } = require('greeting') ?>.
# Unlike views_dir it may be absent at startup: requiring a local
# module then answers a descriptive "Cannot find module" error while
# the crypto polyfill keeps working. `..` segments are rejected at
# validation, and every resolved path must stay INSIDE this directory
# (symlinks included) — require('../../etc/passwd') is a sandbox error.
modules_dir = "modules"

# The module banner (node-jhs2's banned_require, hardened): module
# names require() rejects with a descriptive error, checked BEFORE
# polyfills and files, so an entry can also ban 'crypto' or a local
# module. Entries are plain names (no path separators); 'node:'
# prefixes and subpaths are normalised, so 'fs' covers 'node:fs' and
# 'mv' covers 'mv/sub'. The default ships the dangerous Node built-ins
# (fs, child_process, net, http, ...) plus vm, jhs and mv; trim or
# extend it freely — it is your list.
forbidden_modules = [
  "child_process",
  "cluster",
  "dgram",
  "dns",
  "fs",
  "http",
  "https",
  "inspector",
  "jhs",
  "mv",
  "net",
  "os",
  "process",
  "repl",
  "tls",
  "tty",
  "v8",
  "vm",
  "worker_threads",
]

[templates.sidecar]
# Node sidecar tuning, used while backend is "sidecar" or "auto"
# (ignored by "boa"). Every value below is the default — an empty
# [templates.sidecar] table is a valid configuration.

# Node.js binary used to launch the sidecar service (resolved through
# PATH; override for a specific runtime, e.g. "/usr/bin/node").
node_command = "node"

# The sidecar service script, relative to the working directory
# (absolute paths are allowed too). The shipped sidecar/ directory
# vendors the node-jhs2 2.1.0 engine and needs no npm install.
script = "sidecar/jhs-sidecar.mjs"

# Render worker threads inside the sidecar. Each worker renders one
# template at a time; when a render exceeds render_budget_ms its whole
# worker is terminated (the hard-kill the original engine's vm timeout
# never managed) and a fresh one takes its place.
workers = 2

# Budget for the sidecar launch: process spawn, the READY handshake
# and the 13-check startup selftest.
startup_timeout_ms = 8000

# Client-side timeout for one render request, queue wait included.
# Must exceed render_budget_ms so the hard-kill (not the client) wins
# on runaway renders. Validated at startup.
request_timeout_ms = 10000

# Wall-clock hard-kill budget per render inside the sidecar — the
# bound <?jhs while(true){} ?> templates cannot escape.
render_budget_ms = 5000

[database]
# SQLite persistence layer (user storage for authentication).
# Both [database] and [auth] are opt-in per phase: flip to false to get
# the lean Phase 1/2 server back.
enabled = true

# Connection URL. "mode=rwc" creates the file when missing;
# use "sqlite::memory:" for an ephemeral in-process database instead.
url = "sqlite://wallermax.db?mode=rwc"

# Maximum pool connections. SQLite serializes writes, so small is fine.
max_connections = 5

[auth]
# JWT authentication (requires [database] enabled).
# Mounts POST /api/auth/register, POST /api/auth/login, GET /api/auth/me
# and GET /api/admin/users. The FIRST registered user becomes the admin.
enabled = true

# Secret used to sign access tokens (HMAC-SHA256); at least 32 chars.
# The value below is a DEVELOPMENT secret committed on purpose so
# `cargo run` works out of the box. In production, override it via
# WALLERMAX_AUTH__JWT_SECRET or wallermax.local.toml (git-ignored) —
# never commit a real secret.
jwt_secret = "dev-only-secret-replace-via-WALLERMAX_AUTH__JWT_SECRET"

# Access token lifetime, in seconds.
token_ttl_secs = 3600

# Value of the `iss` (issuer) claim embedded in tokens.
issuer = "wallermax-server"

# Whether new users may register themselves (POST /api/auth/register
# and the registration modal).
registration_enabled = true

# Minimum accepted password length.
min_password_len = 8

# When the `wallermax_session` cookie carries the `Secure` attribute
# (v0.8.0): "auto" (the default) sets it only while [tls] is enabled —
# browsers refuse to store Secure cookies on plain-HTTP origins, and an
# unconditional Secure silently broke browser logins on HTTP dev
# servers (curl/PowerShell were lax, which made it look like a server
# bug). "always" pins it (TLS-terminating proxies), "never" for
# HTTP-only local testing.
secure_cookies = "auto"

# Refresh tokens: long-lived opaque tokens returned by login and rotated
# by POST /api/auth/refresh. Presenting a rotated token (a replay,
# presumably theft) revokes the whole session family. Disable to get the
# access-token-only behaviour of earlier phases.
refresh_tokens_enabled = true

# Refresh token lifetime, in seconds (30 days by default).
refresh_token_ttl_secs = 2592000

# NOTE (v0.7.0): login and refresh also attach the access token as the
# `wallermax_session` cookie (HttpOnly, SameSite=Strict, Path=/,
# Max-Age = token_ttl_secs, and `Secure` per [auth] secure_cookies)
# so BROWSERS stay authenticated across page navigation;
# logout/logout_all clear it. The cookie is verified exactly
# like the Bearer header (the header always wins when both are present).
# The shipped `views/login.jhs` (GET /login) is a plain HTML
# form that logs browsers in without any JavaScript, and the shared
# header partial (views/partials/header.jhs) adds login/registration
# modals — pure CSS, no scripts — to every page.

[cms]
# The small built-in CMS (v0.8.0). Requires [database], [auth] and
# [templates] to be enabled (validated at startup).
#
# Public site: GET /p lists the published pages, GET /p/<slug> renders
# one (the stored body is .jhs template source: it sees the `user`,
# `path`, `query` and `pages` globals and may include the shared
# partials). Admin panel at /admin for the `admin` and `editor` roles:
# pages CRUD, import from public/, user management (admin only),
# self-service password change at /perfil/password. Everything is
# plain HTML forms — the CSP keeps scripts blocked.
#
# The panel manages CONTENT and CMS ACCOUNTS only: server configuration
# stays in wallermax.toml (local repository access).
enabled = true

# ── The corporate content model (F7) ──────────────────────────────
# Hierarchical pages (parent + sibling position, cycle-proof moves,
# breadcrumbs), named navigation menus managed at /admin/menus and
# exposed to every template as the `menus` global, per-page SEO
# metadata (meta title/description/og:image) and an automatic
# sitemap. Full documentation: README-CMS.md. Still zero JavaScript.

# Serve GET /sitemap.xml with the published pages (F7). The sitemap is
# public information (the /p index already lists the same pages), so
# the default is true; set false to keep crawlers on the static tree.
# Override with WALLERMAX_CMS__SITEMAP.
sitemap = true

# Absolute origin of the site, used to build the sitemap's <loc> URLs
# (the protocol requires them absolute). Without it the sitemap falls
# back to the request's Host header with http:// — correct for direct
# HTTP setups, WRONG behind TLS or a reverse proxy: set it there.
# Validated at startup: absolute http(s) origin, no trailing slash.
# Override with WALLERMAX_CMS__SITE_URL.
#
# site_url = "https://www.example.com"

# Slug of the CMS page that takes over GET / (v0.11.0). While set, the
# homepage renders that page through the exact GET /p/<slug> pipeline
# (sandboxed .jhs body, views/cms_page.jhs wrapper, draft gating) and
# the explicit configuration WINS over public/index.html and the
# views/index.jhs auto-routing — rendering directly (no redirect)
# keeps / itself the canonical URL. Left unset (the default) the
# homepage keeps the normal chain.
#
# A slug that stops existing (page deleted, or not created yet) logs a
# warning and GET / falls back to the normal chain — the homepage
# never hard-fails; a DRAFT default page is only visible to editors
# (the public gets the same 404 as /p/<slug>). The slug shape is
# validated at startup exactly like the panel forms validate it.
# Override with WALLERMAX_CMS__DEFAULT_PAGE.
# default_page = "inicio"

[metrics]
# Prometheus exposition endpoint: scrapes return every collected metric
# in the text exposition format. Unauthenticated by design — restrict at
# the network layer when the server is exposed. The request counters are
# fed by the logging middleware, so they need [middleware] logging = true.
enabled = true

# Path of the exposition endpoint.
path = "/metrics"

[tls]
# HTTPS serving with rustls (TLS 1.2/1.3, ring provider). While enabled,
# the server speaks TLS on server.host:server.port using the PEM
# certificate and key below.
enabled = false

# PEM certificate chain and private key, used while tls.enabled = true.
# For development you can generate a self-signed pair with:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout certs/key.pem -out certs/cert.pem -subj "/CN=localhost"
# (or use mkcert for locally-trusted certificates).
# cert_path = "certs/cert.pem"
# key_path = "certs/key.pem"

# Optional plain-HTTP listener ("host:port") that answers every request
# with a 308 redirect to its HTTPS equivalent — e.g. to migrate users
# from http:// to https://. Comment out to disable.
# http_listen = "127.0.0.1:8080"
