[package]
name = "wallermax-manager-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The server-management core of wallermax-manager: layered configuration editing validated by the server's real parser, parent-process supervision, log capture and endpoint metrics."
license = "MIT"
publish = false

[dependencies]
wallermax-server = { path = "../../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"

# Process-tree signalling on Unix (SIGTERM/SIGKILL to the whole group the
# manager created); Windows stops go through `taskkill /T /F` instead.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Tying the server's lifetime to the manager's on Windows: the child is
# assigned to a job object armed with JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE,
# so a manager that dies — closed, crashed or killed — takes the whole
# server tree down with it instead of leaving an invisible orphan holding
# the port (the exact cause of "os error 10048" on the next start).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
