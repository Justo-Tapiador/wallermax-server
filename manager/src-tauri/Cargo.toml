[package]
name = "wallermax-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The wallermax-manager desktop application: a native window over the server-management core."
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wallermax-manager-core = { path = "../crates/wallermax-manager-core" }
