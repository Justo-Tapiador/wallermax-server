[package]
name = "wallermax-server"
version = "0.12.0"
edition = "2021"
rust-version = "1.88"
description = "A modular, secure and high-performance web server written in Rust."
license = "MIT"
readme = "README.md"
keywords = ["web-server", "http", "middleware", "modular", "axum"]
categories = ["web-programming::http-server"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower-http = { version = "0.6", features = ["cors", "limit", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
config = { version = "0.14", features = ["toml"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
jsonwebtoken = "9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
prometheus = { version = "0.13.4", default-features = false, features = ["process"] }
sha2 = "0.10"
base64 = "0.22"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
boa_engine = "0.21.1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }

[dev-dependencies]
rcgen = "0.14.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
