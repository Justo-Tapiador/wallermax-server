<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wallermax-server</title>
</head>
<body>
  <h1>Hello, world!</h1>
  <p>
    This page is served by wallermax-server from
    <code>public/index.html</code> (see the <code>[static]</code> section
    of <code>wallermax.toml</code>). Drop your own files in
    <code>public/</code> and they are served from the root path.
  </p>
  <p>
    The JSON API index lives at <code>/api</code>, health at
    <code>/health</code> and stats at <code>/api/stats</code>.
  </p>
</body>
</html>
