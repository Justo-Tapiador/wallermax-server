# Continuous integration for wallermax-server.
#
# Three jobs, from cheapest to most expensive:
#
#   lint    — formatting and clippy (warnings are errors) on Linux;
#   test    — the full test suite on Linux and Windows (the two platforms
#             the project is developed against);
#   docker  — builds the container image with the Dockerfile (which pins
#             the MSRV toolchain, so this doubles as the MSRV check) and
#             smoke-tests /health and /metrics inside the container.
#
# Everything runs on `cargo --locked`, so the committed Cargo.lock is part
# of what CI protects.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable, rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --locked

  docker:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (MSRV toolchain, cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wallermax-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (/health, /metrics, static index, JHS sidecar, media)
        run: |
          docker run -d --name wallermax-ci -p 8080:8080 wallermax-server:ci

          # Wait for startup (migrations + sidecar + listener) with a timeout.
          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then
              healthy=1
              break
            fi
            sleep 1
          done

          # A timeout here almost always means the process died at boot
          # (config validation, permissions, migrations) — surface the
          # container's own log instead of failing on a bare curl exit 7
          # with no clue. docker logs works on stopped containers too.
          if [ "$healthy" -ne 1 ]; then
            echo "::error::the container never answered /health within 30s"
            echo "----- docker logs wallermax-ci -----"
            docker logs --tail 200 wallermax-ci || true
            exit 1
          fi

          curl -fsS http://127.0.0.1:8080/health
          echo
          curl -fsS http://127.0.0.1:8080/metrics | grep -F 'wallermax_uptime_seconds'
          # v0.10.1: the backend gauge must report the sidecar live.
          curl -fsS http://127.0.0.1:8080/metrics | grep -F 'wallermax_template_backend{backend="sidecar"} 1'
          curl -fsS -o /dev/null -w 'static index: %{http_code}\n' http://127.0.0.1:8080/

          # v0.10.0: the template backend must be the Node sidecar inside
          # the image — sidecar-check.jhs calls require('url'), which the
          # in-process boa sandbox cannot resolve (it would answer the
          # module banner as a 500 and fail this curl -f).
          curl -fsS 'http://127.0.0.1:8080/sidecar-check.jhs?probe=7' | grep -F 'sidecar-ok:7'

          # v0.13.x: the media library root must live on the writable
          # /data volume (WALLERMAX_CMS__MEDIA_DIR) — the F9 startup
          # check creates it as the app user, so "exists and is writable"
          # proves the whole path the docker boot fix opened up.
          docker exec wallermax-ci test -d /data/media
          docker exec wallermax-ci test -w /data/media
          echo 'media root: /data/media exists and is writable'

          docker rm -f wallermax-ci
